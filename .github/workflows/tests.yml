name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out xian-stable-protocol
        uses: actions/checkout@v7
        with:
          path: xian-stable-protocol

      - name: Check out xian-contracting
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-contracting
          ref: main
          path: xian-contracting

      - name: Use matching xian-contracting branch when available
        env:
          MATCHING_BRANCH: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${MATCHING_BRANCH}"
          REMOTE="https://github.com/${{ github.repository_owner }}/xian-contracting"
          if git ls-remote --exit-code --heads "$REMOTE" "$BRANCH" >/dev/null 2>&1; then
            git -C xian-contracting fetch --depth=1 origin "$BRANCH"
            git -C xian-contracting checkout -B "$BRANCH" FETCH_HEAD
          fi

      - name: Check out xian-cli
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-cli
          ref: main
          path: xian-cli

      - name: Check out xian-abci
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-abci
          ref: main
          path: xian-abci

      - name: Check out xian-meta
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-meta
          ref: main
          path: xian-meta

      - name: Check out xian-py
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-py
          ref: main
          path: xian-py

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Report resolved sibling SHAs
        run: python xian-meta/scripts/report_workspace_shas.py --workspace-root .

      - name: Sync dependencies
        working-directory: xian-stable-protocol
        run: uv sync --locked --group dev --group deploy
      - name: Audit authored contract conformance coverage
        working-directory: xian-stable-protocol
        run: |
          uv run --project ../xian-contracting python \
            ../xian-contracting/scripts/audit_authored_conformance.py \
            ./contracts \
            --fail-on-issues
      - name: Run tests
        working-directory: xian-stable-protocol
        run: uv run --locked --group deploy pytest -q
